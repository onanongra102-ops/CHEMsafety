
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานเปิด-ปิดถัง | CHEMsafety+</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, "Noto Sans Thai", Arial, sans-serif;
      background: #E9F4F0;
      color: #17483B;
    }

    .topbar {
      background: linear-gradient(135deg, #00644B, #004B3B);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .topbar h1 {
      margin: 0;
      font-size: 25px;
    }

    .topbar p {
      margin: 8px 0 0;
      font-size: 13px;
    }

    .content {
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      padding: 22px 18px;
      background: white;
      border-radius: 20px 20px 0 0;
    }

    .back-button {
      border: none;
      background: #E2F7EE;
      color: #00513E;
      border-radius: 9px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
    }

    h2 {
      margin: 24px 0 8px;
      color: #103E35;
      font-size: 23px;
    }

    .description {
      color: #456B5F;
      font-size: 14px;
      line-height: 1.7;
    }

    .report-card {
      margin-top: 20px;
      padding: 20px;
      background: #F5FAF7;
      border: 1px solid #D8E9E2;
      border-radius: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #C9DED5;
      border-radius: 9px;
      font-family: inherit;
      font-size: 15px;
      background: white;
      color: #17483B;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .submit-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #00644B;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-button:active {
      opacity: 0.85;
    }
    .note {
      margin-top: 15px;
      color: #628075;
      font-size: 12px;
      line-height: 1.7;
    }

    /* ซ่อนแถบเลื่อน แต่ยังเลื่อนหน้าจอได้ */
html, body {
  scrollbar-width: none;       /* Firefox */
  -ms-overflow-style: none;    /* Edge รุ่นเก่า */
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;               /* Chrome และ Edge */
}

.action-buttons {
  display: flex;
  gap: 12px;
}

.action-option {
  flex: 1;
  margin: 0;
  cursor: pointer;
}

.action-option input {
  display: none;
}

.action-option span {
  display: block;
  padding: 14px;
  text-align: center;
  border: 2px solid #C9DED5;
  border-radius: 10px;
  background: white;
  color: #17483B;
  font-size: 16px;
  transition: 0.2s;
}

.open-option input:checked + span {
  background: #DDF5E8;
  border-color: #00804F;
  color: #00644B;
  font-weight: bold;
}

.close-option input:checked + span {
  background: #FCE8E6;
  border-color: #D64545;
  color: #B42318;
  font-weight: bold;
}

.action-option span {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.action-option svg {
  width: 20px;
  height: 20px;
  stroke-width: 2;
}
.required-mark {
  color: #e53935;
  margin-left: 4px;
  font-weight: bold;
}
  </style>
<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <header class="topbar">
    <h1>CHEMsafety+</h1>
    <p>ระบบรายงานความปลอดภัยสารเคมี</p>
  </header>

  <main class="content">
    <button class="back-button"
      onclick="window.location.href='home.html'">
      ← กลับหน้าหลัก
    </button>

    <h2>รายงานเปิด-ปิดถัง</h2>

    <p class="description">
      บันทึกข้อมูลการเปิดและปิดถังสารเคมี
      เพื่อใช้ตรวจสอบและติดตามการปฏิบัติงาน
    </p>

    
<form class="report-card" id="reportForm">

  <!-- ชื่อพนักงาน -->
  <div class="form-group">
    <label for="employeeName">ชื่อพนักงาน <span class="required-mark">*</span></label>
    <input
      id="employeeName"
      name="employeeName"
      type="text"
      placeholder="ระบุชื่อพนักงาน"
      required
    >
  </div>

  <!-- ชื่อสารเคมี -->
  <div class="form-group">
    <label for="chemicalName">ชื่อสารเคมี <span class="required-mark">*</span></label>
    <input
      id="chemicalName"
      name="chemicalName"
      type="text"
      placeholder="ระบุชื่อสารเคมี"
      required
    >
  </div>

  <!-- หมายเลขถัง -->
  <div class="form-group">
    <label for="tankNumber">หมายเลขถัง <span class="required-mark">*</span></label>
    <select id="tankNumber" name="tankNumber" required>
      <option value="">-- เลือกหมายเลขถัง --</option>
      <option value="TANK-01">TANK-01</option>
      <option value="TANK-02">TANK-02</option>
      <option value="TANK-03">TANK-03</option>
      <option value="TANK-04">TANK-04</option>
      <option value="TANK-05">TANK-05</option>
      <option value="TANK-06">TANK-06</option>
      <option value="TANK-07">TANK-07</option>
      <option value="TANK-08">TANK-08</option>
      <option value="TANK-09">TANK-09</option>
      <option value="TANK-10">TANK-10</option>
    </select>
  </div>

  <!-- ประเภทการปฏิบัติงาน -->
  <div class="form-group">
    <label>ประเภทการปฏิบัติงาน <span class="required-mark">*</span></label>

    <div class="action-buttons">
      <label class="action-option open-option">
        <input
          type="radio"
          name="action"
          value="เปิดถัง"
          required
        >
        <span>
          <i data-lucide="lock-open"></i>
          เปิดถัง
        </span>
      </label>

      <label class="action-option close-option">
        <input
          type="radio"
          name="action"
          value="ปิดถัง"
          required
        >
        <span>
          <i data-lucide="lock"></i>
          ปิดถัง
        </span>
      </label>
    </div>
  </div>

  <!-- วันที่และเวลาปฏิบัติงาน -->
  <div class="form-group">
    <label for="workDateTime">วันที่และเวลาปฏิบัติงาน <span class="required-mark">*</span></label>
    <input
      id="workDateTime"
      name="workDateTime"
      type="datetime-local"
      required
    >
  </div>

  <!-- รายละเอียดเพิ่มเติม: ไม่บังคับกรอก -->
  <div class="form-group">
    <label for="details">รายละเอียดเพิ่มเติม (ถ้ามี)</label>
    <textarea
      id="details"
      name="details"
      placeholder="ระบุรายละเอียดหรือสิ่งผิดปกติที่พบ (ถ้ามี)"
    ></textarea>
  </div>

  <!-- ปุ่มบันทึกรายงาน -->
  <button type="submit" class="submit-button">
    บันทึกรายงาน
  </button>

  <p class="note">
    * กรุณากรอกข้อมูลให้ครบทุกช่อง 

</form>

    
    </form>
  </main>

  <script>
    document.getElementById("reportForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        alert(
          "ตรวจสอบข้อมูลเรียบร้อยแล้ว\n" +
          "ตัวอย่างนี้ยังไม่ได้บันทึกลงฐานข้อมูล"
        );
      });
  </script>
  
<script>
  lucide.createIcons();
</script>
</body>
</html>
